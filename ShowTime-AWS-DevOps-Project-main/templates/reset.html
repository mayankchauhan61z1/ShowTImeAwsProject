<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='L&S.css') }}">
  <style>
    .reset-container {
      width: 400px;
      background: #0d1b2a;
      border-radius: 15px;
      padding: 30px;
      text-align: center;
      color: #fff;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    .reset-container h3 {
      color: #00c6ff;
      margin-bottom: 20px;
    }

    .reset-container input {
      width: 100%;
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 5px;
      border: none;
    }

    .reset-container button {
      width: 100%;
      padding: 10px;
      background: #00c6ff;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    .reset-container a {
      display: block;
      margin-top: 15px;
      color: #00c6ff;
      text-decoration: none;
      font-size: 14px;
    }

    .reset-container a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container" style="justify-content:center; align-items:center;">
    <div class="reset-container">
      <h3>Reset Your Password</h3>
      <p>Enter a new password below to update your account.</p>
      <form action="/reset/{{ token }}" method="POST">
        <input type="password" name="password" placeholder="New Password" required>
        <button type="submit">Update Password</button>
      </form>
      <a href="/login">Back to Login</a>
    </div>
  </div>
</body>
</html>
